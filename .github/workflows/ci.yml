name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz fonts-noto-cjk fontconfig

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -q

  npm-lock:
    name: JavaScript lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate npm lockfile
        run: npm ci --ignore-scripts

  docker:
    name: Docker slim build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build slim image
        run: docker build -f Dockerfile.slim -t md-viewer-docx-service:ci .
